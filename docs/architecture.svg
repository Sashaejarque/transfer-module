<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="ui-monospace, 'SF Mono', 'Roboto Mono', Menlo, Consolas, monospace">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8ca2bd"></path>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="500" fill="#07111f"></rect>

  <!-- Row 1: Frontend, API Gateway, Core API, SNS -->
  <rect x="32.5" y="20" width="190" height="70" rx="14" fill="#0d1a2c" stroke="#203650" stroke-width="1.5"></rect>
  <text x="127.5" y="60" text-anchor="middle" fill="#eef5ff" font-size="13">Frontend</text>

  <rect x="247.5" y="20" width="190" height="70" rx="14" fill="#0d1a2c" stroke="#203650" stroke-width="1.5"></rect>
  <text x="342.5" y="60" text-anchor="middle" fill="#eef5ff" font-size="13">API Gateway</text>

  <rect x="462.5" y="20" width="190" height="70" rx="14" fill="#0d1a2c" stroke="#203650" stroke-width="1.5"></rect>
  <text x="557.5" y="60" text-anchor="middle" fill="#eef5ff" font-size="13">Core API</text>

  <rect x="677.5" y="20" width="190" height="70" rx="14" fill="#0d1a2c" stroke="#203650" stroke-width="1.5"></rect>
  <text x="772.5" y="60" text-anchor="middle" fill="#eef5ff" font-size="13">SNS</text>

  <line x1="222.5" y1="55" x2="243.5" y2="55" stroke="#8ca2bd" stroke-width="1.5" marker-end="url(#arr)"></line>
  <line x1="437.5" y1="55" x2="458.5" y2="55" stroke="#8ca2bd" stroke-width="1.5" marker-end="url(#arr)"></line>
  <line x1="652.5" y1="55" x2="673.5" y2="55" stroke="#8ca2bd" stroke-width="1.5" marker-end="url(#arr)"></line>

  <!-- Row 2: SQS, Worker, Mock COELSA -->
  <rect x="140" y="170" width="190" height="70" rx="14" fill="#0d1a2c" stroke="#203650" stroke-width="1.5"></rect>
  <text x="235" y="210" text-anchor="middle" fill="#eef5ff" font-size="13">SQS</text>

  <rect x="355" y="170" width="190" height="70" rx="14" fill="#0d1a2c" stroke="#203650" stroke-width="1.5"></rect>
  <text x="450" y="210" text-anchor="middle" fill="#eef5ff" font-size="13">Worker</text>

  <rect x="570" y="170" width="190" height="70" rx="14" fill="#0d1a2c" stroke="#203650" stroke-width="1.5"></rect>
  <text x="665" y="205" text-anchor="middle" fill="#eef5ff" font-size="13">Mock COELSA</text>
  <text x="665" y="222" text-anchor="middle" fill="#8ca2bd" font-size="9.5">1.5s · ~15% de fallas</text>

  <line x1="330" y1="205" x2="351" y2="205" stroke="#8ca2bd" stroke-width="1.5" marker-end="url(#arr)"></line>
  <line x1="545" y1="205" x2="566" y2="205" stroke="#8ca2bd" stroke-width="1.5" marker-end="url(#arr)"></line>

  <!-- connectors between row1 and row2 -->
  <path d="M 772.5 90 L 772.5 130 L 235 130 L 235 166" fill="none" stroke="#8ca2bd" stroke-width="1.5" marker-end="url(#arr)"></path>

  <!-- Ledger -->
  <rect x="310" y="270" width="280" height="100" rx="14" fill="#12243a" stroke="#b7f36b" stroke-width="1.75"></rect>
  <text x="450" y="296" text-anchor="middle" fill="#eef5ff" font-size="14" font-weight="600">DynamoDB Ledger</text>
  <text x="450" y="322" text-anchor="middle" fill="#8ca2bd" font-size="11">✓ Liquida ~85% · ✗ Revierte ~15%</text>
  <text x="450" y="342" text-anchor="middle" fill="#8ca2bd" font-size="10">append-only · sin UPDATE</text>

  <path d="M 665 240 L 665 255 L 450 255 L 450 266" fill="none" stroke="#b7f36b" stroke-width="1.75" marker-end="url(#arr)"></path>

  <!-- Row 3: Streams, PDF, S3 -->
  <rect x="140" y="410" width="190" height="70" rx="14" fill="#0d1a2c" stroke="#203650" stroke-width="1.5"></rect>
  <text x="235" y="445" text-anchor="middle" fill="#eef5ff" font-size="12.5">DynamoDB Streams</text>
  <text x="235" y="462" text-anchor="middle" fill="#8ca2bd" font-size="9.5">event source</text>

  <rect x="355" y="410" width="190" height="70" rx="14" fill="#0d1a2c" stroke="#203650" stroke-width="1.5"></rect>
  <text x="450" y="450" text-anchor="middle" fill="#eef5ff" font-size="13">PDF (Lambda)</text>

  <rect x="570" y="410" width="190" height="70" rx="14" fill="#12243a" stroke="#b7f36b" stroke-width="1.75"></rect>
  <text x="665" y="450" text-anchor="middle" fill="#eef5ff" font-size="13">S3 (privado)</text>

  <line x1="330" y1="445" x2="351" y2="445" stroke="#8ca2bd" stroke-width="1.5" marker-end="url(#arr)"></line>
  <line x1="545" y1="445" x2="566" y2="445" stroke="#b7f36b" stroke-width="1.75" marker-end="url(#arr)"></line>

  <path d="M 310 320 L 235 320 L 235 406" fill="none" stroke="#8ca2bd" stroke-width="1.5" marker-end="url(#arr)"></path>
</svg>
